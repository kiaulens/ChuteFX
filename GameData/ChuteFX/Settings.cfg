// ChuteFX - settings (read when the game starts)
CHUTEFX
{
	enabled = true
	debugLog = true            // messages tagged [ChuteFX] in KSP.log

	// --- Part 1: open canopy in flight ---
	flightEffects = true       // flutter/lean in flight (false = original canopy unchanged)
	flutterAmplitude = 0.04    // strength of the flutter (fraction of the canopy radius)
	flutterFrequency = 6       // speed of the flutter
	breatheAmplitude = 0.03    // "breathing" (pulsing) of the canopy
	breatheFrequency = 1.3
	leanStrength = 0.35        // lean from sideways airflow
	holdHeight = 6             // m above ground: below this the open canopy keeps its orientation (no tipping at touchdown)
	recalcNormals = true       // recompute the lighting of the deformation (nicer, slightly more expensive)
	clusterSpread = false      // cluster: open canopies of one vessel tilt apart instead of interpenetrating in the air
	                           //    (rendering only). Off = stock behaviour: with SAS corrections or when the capsule rolls,
	                           //    the cluster kept rearranging (stock turns every canopy itself according to its mount)
	clusterGap = 0.95          // spacing of the canopies in a cluster (fraction of the sum of their radii; smaller = tighter)
	clusterMaxTilt = 35        // degrees: at most this far a canopy tilts sideways

	// --- Wind (shared by all canopies, changes slowly with game time) ---
	windSpeed = 3              // m/s, multiplied by windMin..windMax
	windMin = 0.2
	windMax = 1.4

	// --- Part 2: cut canopy in the air ---
	sailDrag = 2.0             // sail effect: wind pushes normal to the cloth (tilts/pulls the canopy)
	isoDrag = 0.3              // all-round drag independent of the surface orientation
	inflatePressure = 8        // residual pressure: the canopy stays inflated briefly after the cut (fades out over deflateTime)
	deflateTime = 3            // s until residual pressure/shape memory are gone
	cutTerminalSpeed = 4       // m/s reference speed for the drag
	turbulence = 6             // air turbulence (flutter while falling)
	spreadPush = 5             // after landing every canopy falls away from the vessel (direction of its mount); 0 = off

	// --- Cloth ---
	clothIterations = 5        // passes per step: higher = tauter, but more expensive
	damping = 0.02             // damping per simulation step
	compressStiffness = 0.3    // resistance to compression in the air (stretching is always hard)
	bendStiffness = 0.2        // bending stiffness in the air
	groundCompressStiffness = 0.8  // on the ground: resistance to compression (a few large folds instead of crumpling)
	groundBendStiffness = 0.6      // on the ground: bending stiffness
	minPieceSize = 20          // cloth pieces with fewer points are removed (line caps and the like)

	// --- Lines ---
	ropeSegments = 20          // links per line (more = softer, more expensive)
	lineWidth = 0              // line thickness in m, 0 = automatic from the canopy size
	lineColorAuto = true       // the ropes take the colour of the original lines (read from the canopy texture)
	lineGray = 0.78            // brightness of the lines if their colour cannot be read or lineColorAuto is false
	                           //    (0 = black, 1 = white)
	tetherOnLanding = true     // cut after landing: the lines stay attached to the part

	// --- Ground ---
	groundFriction = 0.6       // 0 = slides, 1 = stops at once
	layerThickness = 0.05      // m: cloth layers stay at least this far apart - folds of one canopy and different canopies
	                           //    no longer interpenetrate; the canopy that landed later lies on top
	                           //    (0 = off: old fixed stack height at touchdown)
	renderSmooth = 0           // smoothing passes for rendering only. Off: on the double-walled ReStock canopies it
	                           //    pulled back hem and vent (bigger hole, zigzag stripes)
	parallaxLift = 0.85        // raise the cloth on land by this fraction of the Parallax terrain displacement (Parallax raises
	                           //    the visible ground against the collider; otherwise flat parts vanish in the ground; 0 = off)
	settleMax = 25             // s after ground contact; at the latest then the canopy comes to rest (if it barely moves)
	groundLifetime = 600       // s of game time (runs with time warp) the canopy stays, then it sinks into the ground
	                           //    (0 = until scene change)

	// --- Visibility ---
	fadeOnHover = true         // a cut canopy under the mouse cursor becomes semi-transparent (you see what you click)
	fadeForKerbals = true      // likewise when it hides a Kerbal (EVA) from the camera
	fadeAlpha = 0.55           // opacity then (0 = invisible, 1 = never transparent)

	// --- Water ---
	waterFloatTime = 20        // s on the water, then it sinks
	soakDelay = 2              // s in its normal colour, then it soaks up water
	soakTime = 5               // s until it is clearly darker (time constant)
	soakDarkness = 0.45        // how much darker the wet canopy gets (0 = not at all, 1 = black)
	sinkSpeed = 0.15           // m/s sink speed
	waterRemoveDepth = 15      // m below the surface it is removed (shallow seabed: it stays there)

	// --- Limits ---
	maxDistance = 5000         // m distance to the active vessel, then removed
	maxFallen = 30             // max. canopies lying around at the same time
}
